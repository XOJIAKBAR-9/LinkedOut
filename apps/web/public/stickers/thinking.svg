<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
<defs><filter id="cut" x="-20%" y="-20%" width="140%" height="140%">
<feMorphology in="SourceAlpha" operator="dilate" radius="6" result="dil"/>
<feFlood flood-color="#fff" result="white"/>
<feComposite in="white" in2="dil" operator="in" result="outline"/>
<feGaussianBlur in="dil" stdDeviation="3" result="blur"/>
<feOffset in="blur" dy="3" result="off"/>
<feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>
<g filter="url(#cut)" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<circle cx="80" cy="82" r="56" fill="#fcd34d"/><circle cx="62" cy="78" r="6" fill="#1f2937" stroke="none"/><circle cx="98" cy="76" r="6" fill="#1f2937" stroke="none"/><path d="M52 62 Q60 56 70 60 M90 54 Q100 50 108 56" fill="none" stroke-width="4"/><path d="M66 108 H96" fill="none"/><circle cx="128" cy="30" r="16" fill="#f8fafc"/><circle cx="108" cy="50" r="5" fill="#f8fafc" stroke-width="3"/><circle cx="121" cy="30" r="2.5" fill="#1f2937" stroke="none"/><circle cx="128" cy="30" r="2.5" fill="#1f2937" stroke="none"/><circle cx="135" cy="30" r="2.5" fill="#1f2937" stroke="none"/>
</g></svg>
